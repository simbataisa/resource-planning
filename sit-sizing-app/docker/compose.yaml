# Base stack (design 12.2). Works on Docker Desktop and Rancher Desktop (dockerd/moby).
# Run through the pnpm scripts, which pass --env-file .env:
#   pnpm stack:up   production-like image
#   pnpm dev:up     adds compose.dev.yaml (hot reload)
#   pnpm dev:obs    adds compose.obs.yaml (tracing viewer)
# Services added later: keycloak (step 1.3), worker (release 2).
name: sit-sizing

services:
  db:
    image: ${REGISTRY_PREFIX:-}postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run pnpm dev:env to create .env}
      # Read only by postgres/init/01-databases.sh on first start (empty volume).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run pnpm dev:env to create .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run pnpm dev:env to create .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tools
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: sit-sizing-tools:local
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  seed:
    # Synthetic data only. Run with `docker compose run --rm seed` (pnpm dev:up does this).
    image: sit-sizing-tools:local
    command: ['pnpm', 'db:seed']
    environment:
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@db:5432/app
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['seed']
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: sit-sizing-web:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@db:5432/app
      OTEL_SERVICE_NAME: sit-sizing-web
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      AUTH_MODE: ${AUTH_MODE:-oidc}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mail:
    # Local mail catcher for invitation, reset and notification emails. Development only.
    image: ${REGISTRY_PREFIX:-}axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

volumes:
  db-data:
