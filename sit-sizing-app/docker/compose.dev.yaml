# Development override: hot reload through a bind mount (design 12.2, 12.3).
# node_modules and .next live in named volumes so host binaries never mix with
# container binaries and bind-mount performance stays acceptable on macOS.
services:
  web:
    build:
      target: dev
    image: sit-sizing-web:dev
    command:
      - sh
      - -c
      # Logs why the dev server stopped before Docker restarts it (it restarts itself on
      # config changes and near its memory limit; a clean exit 0 is otherwise silent).
      - >-
        pnpm install --frozen-lockfile --store-dir /pnpm/store &&
        pnpm --filter @sit/web dev --webpack --hostname 0.0.0.0 --port 3000;
        code=$$?; echo "[dev] next dev exited with code $$code at $$(date -u +%FT%TZ)"; exit $$code
    environment:
      NODE_ENV: development
      # On-demand compilation of every route needs more than Node's default heap; below the
      # limit Next restarts the dev server by itself.
      NODE_OPTIONS: --max-old-space-size=4096
      # Bind mounts on Docker Desktop / Rancher Desktop for macOS do not reliably deliver file
      # events into the container, so hot reload polls. Webpack's watcher supports polling;
      # `pnpm dev` on the host keeps Turbopack.
      WATCHPACK_POLLING: 'true'
    read_only: false
    tmpfs: !reset []
    cap_drop: !reset []
    volumes:
      - ..:/repo
      - nm-root:/repo/node_modules
      - nm-web:/repo/apps/web/node_modules
      - nm-engine:/repo/packages/engine/node_modules
      - nm-schemas:/repo/packages/schemas/node_modules
      - nm-tokens:/repo/packages/tokens/node_modules
      - nm-config:/repo/packages/config/node_modules
      - nm-db:/repo/packages/db/node_modules
      - nm-mcp:/repo/apps/mcp/node_modules
      - next-cache:/repo/apps/web/.next
      - pnpm-store:/pnpm/store
    healthcheck:
      start_period: 120s

  worker:
    # Same bind mount and node_modules volumes as web; web installs them first.
    image: sit-sizing-web:dev
    command: ['node_modules/.bin/tsx', 'watch', 'worker/main.ts']
    environment:
      NODE_ENV: development
    user: !reset null
    read_only: false
    tmpfs: !reset []
    volumes:
      - ..:/repo
      - nm-root:/repo/node_modules
      - nm-web:/repo/apps/web/node_modules
      - nm-engine:/repo/packages/engine/node_modules
      - nm-schemas:/repo/packages/schemas/node_modules
      - nm-tokens:/repo/packages/tokens/node_modules
      - nm-config:/repo/packages/config/node_modules
      - nm-db:/repo/packages/db/node_modules
      - nm-mcp:/repo/apps/mcp/node_modules
    depends_on:
      web:
        condition: service_healthy

  mcp:
    # Same bind mount and node_modules volumes as web; web installs them first. Dev sign-in:
    # acts as the seeded dev-estimator through the API's x-dev-user header (needs AUTH_MODE=dev),
    # so no Keycloak sign-in is needed. Restarts on source changes (tsx watch).
    build: !reset null
    image: sit-sizing-web:dev
    working_dir: /repo/apps/mcp
    command: ['node_modules/.bin/tsx', 'watch', 'src/main.ts']
    environment:
      NODE_ENV: development
      APP_ENV: local
      MCP_DEV_USER: dev-estimator
    user: !reset null
    read_only: false
    tmpfs: !reset []
    volumes:
      - ..:/repo
      - nm-root:/repo/node_modules
      - nm-web:/repo/apps/web/node_modules
      - nm-mcp:/repo/apps/mcp/node_modules
      - nm-engine:/repo/packages/engine/node_modules
      - nm-schemas:/repo/packages/schemas/node_modules
      - nm-tokens:/repo/packages/tokens/node_modules
      - nm-config:/repo/packages/config/node_modules
      - nm-db:/repo/packages/db/node_modules

volumes:
  nm-root:
  nm-web:
  nm-mcp:
  nm-engine:
  nm-schemas:
  nm-tokens:
  nm-config:
  nm-db:
  next-cache:
  pnpm-store:
